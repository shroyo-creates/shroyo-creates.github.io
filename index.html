<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHREYA PANDEY | Security & Software Developer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.css">
  <link rel="stylesheet" href="css/style.css">
</head> 
<body>
  <!-- Layer 1: 3D background (we'll draw on it in Step 4) -->
  <canvas id="bg"></canvas>
  

  

  <!-- Layer 3: navbar -->
  <nav class="navbar">SP.</nav>

  <!-- Layer 2: scrolling content -->
  <main class="content">
    <section class="panel" id="hero"><h1>Hi, I'm Shreya Pandey</h1></section>
    <section class="panel" id="about"><h2>About</h2></section>
    <section class="panel" id="projects"><h2>Projects</h2></section>
    <section class="panel" id="terminal-section">
      <div class="terminal">
    <div class="terminal-header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="terminal-title">shreya@portfolio: ~</span>
    </div>
    </div> 

    <div class="terminal-body" id="terminal-body">
      <p>Welcome to Shreya Pandey's portfolio 👋</p>
      <p>Type <span class="highlight">help</span> to see available commands.</p>

      <div class="input-line">
        <span class="prompt">shreya@portfolio:~$</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
      </div>
    </div>
  
    </section>
  </main>
  <!-- Smooth scroll library (loaded before your own JS) -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>

  <script src="js/main.js"></script>
  <script src="js/terminal.js"></script>
  <script type="module" src="js/background.js"></script>
</body>

</html>
